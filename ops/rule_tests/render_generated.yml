---
# Renders the generated rule files for a local check (see run.sh).
- name: Render the generated rules
  hosts: victoriametrics01.aah.muffn.io
  gather_facts: false
  connection: local
  become: false
  tasks:
    - name: Render host_generated.yml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../ansible/inventory/host_vars/victoriametrics01.aah.muffn.io/files/rules/host_generated.yml.j2"
        dest: "{{ out }}"
        mode: "0644"
    - name: Render switch.yml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../ansible/inventory/host_vars/victoriametrics01.aah.muffn.io/files/rules/switch.yml.j2"
        dest: "{{ out_switch }}"
        mode: "0644"

    - name: Render switch_ignore.yml with sw02 on the exclusion list
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../ansible/inventory/host_vars/victoriametrics01.aah.muffn.io/files/rules/switch.yml.j2"
        dest: "{{ out_switch_ignore }}"
        mode: "0644"
      vars:
        monitoring_switchdown_ignore: [sw02]
