---
# rustguac (browser RDP/SSH/VNC gateway, bundles guacd) with OpenBao as its
# connection store. First-time setup and day-2 steps: README.md here.
podman_enabled: true

podman_networks:
  rustguac: {}

podman_apps:
  openbao:
    enabled: true
    image: docker.io/openbao/openbao
    # renovate: datasource=docker depName=docker.io/openbao/openbao
    tag: 2.7.3
    container_name: openbao
    network: rustguac
    # Image user openbao (uid 100, gid 1000). Not published on the host: only
    # rustguac reaches it, over the rustguac network.
    uid: 100
    gid: 1000
    # The image's default command is `server -dev` (in-memory); override it.
    exec: server
    volumes:
      - /opt/openbao/file:/openbao/file
    env:
      TZ: Europe/London
      SKIP_CHOWN: "true"
      BAO_LOCAL_CONFIG: "{{ rustguac_openbao_config | to_json }}"
      BAO_UNSEAL_KEY: "{{ rustguac_openbao_unseal_key | trim }}"

  rustguac:
    enabled: true
    image: docker.io/sol1/rustguac
    # renovate: datasource=docker depName=docker.io/sol1/rustguac
    tag: 1.15.2
    container_name: rustguac
    network: rustguac
    port: 8089
    startup_timeout: 60
    # Image user rustguac is 996:996 (verified against the 1.14.1 image).
    # Pinned so a rebuilt image cannot silently change bind mount ownership.
    user: "996:996"
    uid: 996
    gid: 996
    after:
      - openbao.service
    requires:
      - openbao.service
    volumes:
      - /opt/rustguac/data:/opt/rustguac/data
      # Named volume, not a bind mount: rustguac sets its recordings dir to 0750
      # at startup, which the role's bind mount handling would reset to 0755 on
      # every deploy (restarting the service each time).
      - rustguac-recordings:/opt/rustguac/recordings
      - /opt/rustguac/config/config.toml:/opt/rustguac/config.toml:ro
    files:
      - dest: /opt/rustguac/config/config.toml
        template_src: config.toml.j2
        owner: root
        group: root
        mode: "0644"
    env:
      TZ: Europe/London
      RUST_LOG: info
      # Both are read only when the matching [oidc] / [vault] block is
      # rendered into config.toml (see the defined-checks in config.toml.j2).
      OIDC_CLIENT_SECRET: "{{ rustguac_oidc_client_secret | default('') | trim }}"
      VAULT_SECRET_ID: "{{ rustguac_vault_secret_id | default('') | trim }}"

# Allowlist of hosts rustguac may open RDP sessions to. Loopback plus the
# specific machines users are meant to reach (a /32 each).
rustguac_rdp_allowed_networks:
  - 127.0.0.0/8
  - "::1/128"
  - 10.82.3.102/32

# Hops whose X-Forwarded-For entries are skipped when working out the client
# IP: the two ingress hosts, plus the ingress hosts' podman network, where
# cloudflared sits (Traefik appends its address to the header). Without the
# network, every visitor resolves to cloudflared's address and shares one
# rate-limit allowance.
rustguac_trusted_proxies:
  - 10.82.3.106/32
  - 10.82.3.107/32
  - 10.89.0.0/29

# OpenBao: single node, integrated (raft) storage (the file backend no longer
# exists), auto-unsealed with a static key so a restart needs no manual unseal.
# The key lives next to the data it protects; acceptable for this single-host
# store, see README.md.
rustguac_openbao_config:
  ui: false
  disable_mlock: true
  api_addr: http://openbao:8200
  cluster_addr: http://openbao:8201
  storage:
    raft:
      path: /openbao/file
      node_id: openbao-1
  listener:
    tcp:
      address: 0.0.0.0:8200
      tls_disable: true
  seal:
    static:
      current_key_id: rustguac-1
      current_key: env://BAO_UNSEAL_KEY

# OpenBao AppRole for rustguac (bootstrapped once; steps in README.md).
