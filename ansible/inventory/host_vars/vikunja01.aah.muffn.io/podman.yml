---
podman_enabled: true

podman_networks:
  vikunja: {}

podman_apps:
  vikunja-postgres:
    enabled: true
    image: postgres
    # renovate: datasource=docker depName=postgres
    tag: "17.11-trixie"
    container_name: vikunja-postgres
    network: vikunja
    uid: 999
    gid: 999
    volumes:
      - /opt/vikunja/postgres:/var/lib/postgresql/data
    env:
      POSTGRES_USER: vikunja
      POSTGRES_PASSWORD: "{{ vikunja_db_password | trim }}"
      POSTGRES_DB: vikunja
      PGDATA: /var/lib/postgresql/data
      TZ: Europe/London

  vikunja:
    enabled: true
    image: docker.io/vikunja/vikunja
    # renovate: datasource=docker depName=docker.io/vikunja/vikunja
    tag: "2.6.0"
    port: 3456
    user: "1000:1000"
    uid: 1000
    gid: 1000
    network: vikunja
    container_name: vikunja
    after:
      - vikunja-postgres.service
    requires:
      - vikunja-postgres.service
    volumes:
      - /opt/vikunja/files:/app/vikunja/files
    env:
      TZ: Europe/London
      VIKUNJA_SERVICE_TIMEZONE: Europe/London
      VIKUNJA_SERVICE_PUBLICURL: "{{ vikunja_public_url | trim }}"
      VIKUNJA_SERVICE_JWTSECRET: "{{ vikunja_jwt_secret | trim }}"
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
      VIKUNJA_FILES_BASEPATH: /app/vikunja/files
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: vikunja-postgres
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_PASSWORD: "{{ vikunja_db_password | trim }}"
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_AUTH_LOCAL_ENABLED: "false"
      VIKUNJA_AUTH_OPENID_ENABLED: "true"
      VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_NAME: Pocket ID
      VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_AUTHURL: "{{ vikunja_oidc_issuer | trim }}"
      VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTID: "{{ vikunja_oidc_client_id | trim }}"
      VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_CLIENTSECRET: "{{ vikunja_oidc_client_secret | trim }}"
      VIKUNJA_AUTH_OPENID_PROVIDERS_POCKETID_SCOPE: openid profile email
      VIKUNJA_MAILER_ENABLED: "true"
      VIKUNJA_MAILER_HOST: "{{ vikunja_mailer_host | trim }}"
      VIKUNJA_MAILER_PORT: "465"
      VIKUNJA_MAILER_AUTHTYPE: plain
      VIKUNJA_MAILER_USERNAME: "{{ vikunja_mailer_username | trim }}"
      VIKUNJA_MAILER_PASSWORD: "{{ vikunja_mailer_password | trim }}"
      VIKUNJA_MAILER_FROMEMAIL: "{{ vikunja_mailer_from | trim }}"
      VIKUNJA_MAILER_FORCESSL: "true"
      VIKUNJA_DEFAULTSETTINGS_EMAIL_REMINDERS_ENABLED: "true"

