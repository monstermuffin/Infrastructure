# dogtagger_api_key_c: !vault |

# The UI container's nginx proxies /api/ to the hostname "dog-tagger".
podman_networks:
  dogtagger:
    driver: bridge

# https://github.com/bradreimer/immich-dog-tagger/issues/436
podman_apps:
  dog-tagger:
    enabled: true
    display_name: Dog Tagger API
    image: ghcr.io/bradreimer/immich-dog-tagger
    tag: sha-a1c8489
    container_name: dog-tagger
    network: dogtagger
    volumes:
      - /opt/dogtagger/state:/app/state
      - /opt/dogtagger/cache:/app/cache
      - /opt/dogtagger/models:/app/models
      - /opt/dogtagger/config.json:/app/config/config.json:ro
    podman_args:
      - "--entrypoint=uvicorn"
    exec: immich_dog_tagger.api.app:app --host 0.0.0.0 --port 8000
    env:
      TZ: Europe/London
      CONFIG_FILE: /app/config/config.json
      STATE_DIR: /app/state
      CACHE_DIR: /app/cache
      YOLO_MODEL: /app/models/yolo11m.pt
      HF_HOME: /app/models/huggingface
    files:
      - dest: /opt/dogtagger/config.json
        template_src: config.json.j2
        owner: root
        group: root
        mode: "0600"

  dog-tagger-ui:
    enabled: true
    display_name: Dog Tagger
    image: ghcr.io/bradreimer/immich-dog-tagger-ui
    tag: sha-a1c8489
    container_name: dog-tagger-ui
    network: dogtagger
    port: 8080
    container_port: 80
    after:
      - dog-tagger.service
    requires:
      - dog-tagger.service
