---
podman_enabled: true

podman_networks:
  mcphub: {}

podman_apps:
  mcphub:
    enabled: true
    image: docker.io/samanhappy/mcphub
    tag: latest
    port: 3000
    network: mcphub
    volumes:
      - /opt/mcphub/mcp_settings.json:/app/mcp_settings.json
      - /opt/mcphub/data:/app/data
      - /opt/mcphub/servers:/opt/mcphub-servers:ro
    files:
      - dest: /opt/mcphub/mcp_settings.json
        template_src: mcp_settings.json.j2
        owner: root
        group: root
        mode: "0640"
      - dest: /opt/mcphub/servers/places_mcp.py
        src: servers/places_mcp.py
        mode: "0644"
    env:
      TZ: Europe/London
      NODE_ENV: production
      INSTALL_BASE_URL: http://mcphub01.lcy.muffn.io:3000
      JWT_SECRET: "{{ mcphub_jwt_secret }}"
      ADMIN_PASSWORD: "{{ mcphub_admin_password }}"

  # oauth for hass mcp
  mcphub-hass-proxy:
    enabled: true
    image: ghcr.io/traefik/traefik
    # renovate: datasource=docker depName=ghcr.io/traefik/traefik
    tag: v3.7.13
    description: mcphub auth proxy for Home Assistant
    # ports (not port) so the LXC note stays with mcphub
    ports:
      - "3100:3100"
    network: mcphub
    after:
      - mcphub.service
    volumes:
      - /opt/mcphub-hass-proxy/traefik.yml:/etc/traefik/traefik.yml:ro
      - /opt/mcphub-hass-proxy/dynamic.yml:/etc/traefik/dynamic.yml:ro
    files:
      - dest: /opt/mcphub-hass-proxy/traefik.yml
        template_src: mcphub-hass-proxy/traefik.yml.j2
        mode: "0644"
      - dest: /opt/mcphub-hass-proxy/dynamic.yml
        template_src: mcphub-hass-proxy/dynamic.yml.j2
        mode: "0600"
    exec: --configFile=/etc/traefik/traefik.yml

