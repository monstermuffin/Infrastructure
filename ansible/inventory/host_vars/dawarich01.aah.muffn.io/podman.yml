---
podman_enabled: true

podman_networks:
  dawarich: {}

podman_apps:
  dawarich-redis:
    enabled: true
    image: redis
    # renovate: datasource=docker depName=redis versioning=regex:^(?<major>7)(\.(?<minor>\d+)(\.(?<patch>\d+))?)?(-.*)?$
    tag: "7.4.11-bookworm"
    container_name: dawarich-redis
    network: dawarich
    volumes:
      - /opt/dawarich/redis:/data

  dawarich-db:
    enabled: true
    image: postgis/postgis
    # renovate: datasource=docker depName=postgis/postgis versioning=regex:^(?<major>17)-(?<minor>3\.5)(-.*)?$
    tag: "17-3.5-alpine"
    container_name: dawarich-db
    network: dawarich
    shm_size: 1g
    volumes:
      - /opt/dawarich/postgres:/var/lib/postgresql/data
    env:
      POSTGRES_USER: dawarich
      POSTGRES_PASSWORD: "{{ dawarich_db_password | trim }}"
      POSTGRES_DB: dawarich_production

  dawarich-app:
    enabled: true
    image: freikin/dawarich
    # renovate: datasource=docker depName=freikin/dawarich
    tag: "1.12.2"
    container_name: dawarich-app
    port: 3000
    network: dawarich
    startup_timeout: 120
    after:
      - dawarich-db.service
      - dawarich-redis.service
    requires:
      - dawarich-db.service
      - dawarich-redis.service
    volumes:
      - /opt/dawarich/public:/var/app/public
      - /opt/dawarich/watched:/var/app/tmp/imports/watched
      - /opt/dawarich/storage:/var/app/storage
    podman_args:
      - "--entrypoint=/usr/local/bin/web-entrypoint.sh"
    exec: "bin/rails server -p 3000 -b ::"
    env:
      RAILS_ENV: production
      REDIS_URL: redis://dawarich-redis:6379
      DATABASE_HOST: dawarich-db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: dawarich
      DATABASE_PASSWORD: "{{ dawarich_db_password | trim }}"
      DATABASE_NAME: dawarich_production
      APPLICATION_HOSTS: "{{ dawarich_domain | trim }}"
      APPLICATION_PROTOCOL: https
      TIME_ZONE: Europe/London
      SECRET_KEY_BASE: "{{ dawarich_secret_key_base | trim }}"
      RAILS_LOG_TO_STDOUT: "true"
      SELF_HOSTED: "true"
      STORE_GEODATA: "true"
      WEB_CONCURRENCY: "1"
      PHOTON_API_HOST: "10.82.10.153:2322"
      PHOTON_API_USE_HTTPS: "false"
      OIDC_CLIENT_ID: "{{ dawarich_oidc_client_id | trim }}"
      OIDC_CLIENT_SECRET: "{{ dawarich_oidc_client_secret | trim }}"
      OIDC_ISSUER: https://id.muffn.io
      OIDC_PROVIDER_NAME: Pocket ID
      OIDC_PKCE_ENABLED: "true"
      OIDC_REDIRECT_URI: "https://{{ dawarich_domain | trim }}/users/auth/openid_connect/callback"
      ALLOW_EMAIL_PASSWORD_LOGIN: "false"

  dawarich-sidekiq:
    enabled: true
    image: freikin/dawarich
    # renovate: datasource=docker depName=freikin/dawarich
    tag: "1.12.2"
    container_name: dawarich-sidekiq
    network: dawarich
    podman_args:
      - "--entrypoint=/usr/local/bin/sidekiq-entrypoint.sh"
    exec: sidekiq
    after:
      - dawarich-db.service
      - dawarich-redis.service
      - dawarich-app.service
    requires:
      - dawarich-db.service
      - dawarich-redis.service
    volumes:
      - /opt/dawarich/public:/var/app/public
      - /opt/dawarich/watched:/var/app/tmp/imports/watched
      - /opt/dawarich/storage:/var/app/storage
    env:
      RAILS_ENV: production
      REDIS_URL: redis://dawarich-redis:6379
      DATABASE_HOST: dawarich-db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: dawarich
      DATABASE_PASSWORD: "{{ dawarich_db_password | trim }}"
      DATABASE_NAME: dawarich_production
      APPLICATION_HOSTS: "{{ dawarich_domain | trim }}"
      APPLICATION_PROTOCOL: https
      TIME_ZONE: Europe/London
      SECRET_KEY_BASE: "{{ dawarich_secret_key_base | trim }}"
      RAILS_LOG_TO_STDOUT: "true"
      SELF_HOSTED: "true"
      STORE_GEODATA: "true"
      BACKGROUND_PROCESSING_CONCURRENCY: "3"
      PHOTON_API_HOST: "10.82.10.153:2322"
      PHOTON_API_USE_HTTPS: "false"

