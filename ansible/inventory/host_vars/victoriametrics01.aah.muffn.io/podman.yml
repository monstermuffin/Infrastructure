---
podman_enabled: true

podman_networks:
  metrics: {}

podman_apps:
  victoriametrics:
    enabled: true
    image: victoriametrics/victoria-metrics
    # renovate: datasource=docker depName=victoriametrics/victoria-metrics
    tag: v1.152.0
    port: 8428
    network: metrics
    volumes:
      - /opt/victoriametrics01/victoria-metrics-data:/victoria-metrics-data
      - /opt/victoriametrics01/scrape.yml:/etc/victoria-metrics/scrape.yml:ro
    files:
      - dest: /opt/victoriametrics01/scrape.yml
        template_src: prometheus.yml.j2
        owner: root
        group: root
        mode: "0644"
    exec: >-
      -storageDataPath=/victoria-metrics-data
      -retentionPeriod=2y
      -promscrape.config=/etc/victoria-metrics/scrape.yml
    env:
      TZ: Europe/London

  pve-exporter:
    enabled: true
    image: prompve/prometheus-pve-exporter
    # renovate: datasource=docker depName=prompve/prometheus-pve-exporter
    tag: 3.10.0
    port: 9221
    network: metrics
    volumes:
      - /opt/victoriametrics01/pve-exporter.yml:/etc/pve-exporter/pve-exporter.yml:ro
    files:
      - dest: /opt/victoriametrics01/pve-exporter.yml
        template_src: pve-exporter.yml.j2
        mode: "0644"
    exec: --config.file=/etc/pve-exporter/pve-exporter.yml
    env:
      TZ: Europe/London

  vmalert:
    enabled: true
    image: victoriametrics/vmalert
    # renovate: datasource=docker depName=victoriametrics/vmalert
    tag: v1.152.0
    port: 8880
    network: metrics
    after:
      - victoriametrics.service
      - alertmanager.service
    volumes:
      - /opt/victoriametrics01/vmalert/rules:/etc/vmalert/rules:ro
    files:
      - dest: /opt/victoriametrics01/vmalert/rules/pve.yml
        src: rules/pve.yml.static
        mode: "0644"
    exec: >-
      -datasource.url=http://victoriametrics:8428
      -remoteWrite.url=http://victoriametrics:8428
      -remoteRead.url=http://victoriametrics:8428
      -notifier.url=http://alertmanager:9093
      -rule=/etc/vmalert/rules/*.yml
    env:
      TZ: Europe/London

  alertmanager:
    enabled: true
    image: prom/alertmanager
    # renovate: datasource=docker depName=prom/alertmanager
    tag: v0.34.1
    port: 9093
    network: metrics
    uid: 65534
    gid: 65534
    volumes:
      - /opt/victoriametrics01/alertmanager/data:/alertmanager
      - /opt/victoriametrics01/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    files:
      - dest: /opt/victoriametrics01/alertmanager/alertmanager.yml
        src: alertmanager.yml.static
        mode: "0644"
    exec: >-
      --config.file=/etc/alertmanager/alertmanager.yml
      --storage.path=/alertmanager
      --cluster.listen-address=
    env:
      TZ: Europe/London

