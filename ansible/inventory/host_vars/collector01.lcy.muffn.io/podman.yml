podman_enabled: true

podman_apps:
  pve-exporter:
    enabled: true
    image: prompve/prometheus-pve-exporter
    # renovate: datasource=docker depName=prompve/prometheus-pve-exporter
    tag: 3.10.1
    network_mode: host
    ports:
      - "9221:9221"
    volumes:
      - /opt/collector01/pve-exporter.yml:/etc/pve-exporter/pve-exporter.yml:ro
