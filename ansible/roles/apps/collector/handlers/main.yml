---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

# Environment file and package changes need a restart; a config change is
# applied with a reload, which keeps the old config running if the new one
# fails to load.
- name: Restart alloy
  ansible.builtin.systemd:
    name: alloy
    state: restarted
    daemon_reload: true

- name: Reload alloy
  ansible.builtin.systemd:
    name: alloy
    state: reloaded
