---
- name: Check this host is a collector in monitoring_topology
  ansible.builtin.assert:
    that:
      - monitoring_topology is defined
      - inventory_hostname in (monitoring_topology.sites.values() | map(attribute='collector') | list)
    fail_msg: >-
      {{ inventory_hostname }} is not the collector of any site in
      monitoring_topology.sites. Add it there or do not target this host.
  tags: always

# Alloy is installed and running from the linux/alloy dependency. The template
# is passed by absolute path because the shared task runs in that role, so the
# path is fixed here, in this role's context.
- name: Locate the collector templates
  ansible.builtin.set_fact:
    collector_template_src: "{{ role_path }}/templates/collector.alloy.j2"
    collector_snmp_template_src: "{{ role_path }}/templates/snmp.yml.j2"
    collector_snmp_modules_src: "{{ role_path }}/files/snmp_modules.yml.static"
  tags:
    - config

- name: Check the switches of this site have their credential
  ansible.builtin.assert:
    that:
      - ('snmp_community_' ~ item) is in vars
    fail_msg: >-
      No snmp_community_{{ item }} for the switches of {{ collector_site }};
      add the vault value to this collector's podman.yml.
    quiet: true
  loop: "{{ collector_switches | map(attribute='auth') | unique | list }}"
  tags:
    - config

- name: Apply the collector config
  ansible.builtin.include_role:
    name: linux/alloy
    tasks_from: apply_config.yml
  vars:
    alloy_config_set: collector
    alloy_config_files: >-
      {{ [{'src': collector_template_src, 'dest': 'collector.alloy'}]
         + ([{'src': collector_snmp_template_src, 'dest': 'snmp.yml'}] if collector_switches else []) }}
    alloy_config_absent: "{{ [] if collector_switches else ['snmp.yml'] }}"
  tags:
    - config

- name: Apply pending Alloy changes now
  ansible.builtin.meta: flush_handlers

- name: Wait for the push receiver
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ collector_receiver_port }}"
    timeout: 30
  tags:
    - verify
