---
- name: Restart crowdsec
  ansible.builtin.systemd:
    name: crowdsec
    state: restarted

- name: Restart traefik service
  ansible.builtin.systemd:
    name: traefik.service
    state: restarted
  failed_when: false

- name: Restart systemd-tmpfiles-clean timer
  ansible.builtin.systemd:
    name: systemd-tmpfiles-clean.timer
    state: restarted
    daemon_reload: true
