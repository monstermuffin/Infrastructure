---
- name: Check registered MCP servers
  ansible.builtin.command:
    cmd: "{{ ccagent_bin }} mcp list"
  become: true
  become_user: "{{ ccagent_user }}"
  environment:
    HOME: "{{ ccagent_home }}"
  args:
    chdir: "{{ ccagent_workdir }}"
  register: _ccagent_mcp_list
  changed_when: false
  when: ccagent_mcphub_url | length > 0
  tags: [mcp, configure]

- name: Determine registered mcphub URL
  ansible.builtin.set_fact:
    _ccagent_mcphub_registered_url: >-
      {{ (_ccagent_mcp_list.stdout | regex_findall('^mcphub: (\S+)', multiline=True) + [''])[0] }}
  when: ccagent_mcphub_url | length > 0
  tags: [mcp, configure]

- name: Remove existing mcphub MCP server
  ansible.builtin.command:
    argv:
      - "{{ ccagent_bin }}"
      - mcp
      - remove
      - mcphub
  become: true
  become_user: "{{ ccagent_user }}"
  environment:
    HOME: "{{ ccagent_home }}"
  args:
    chdir: "{{ ccagent_workdir }}"
  when:
    - ccagent_mcphub_url | length > 0
    - _ccagent_mcphub_registered_url | length > 0
    - (ccagent_mcp_force_register | default(false) | bool) or (_ccagent_mcphub_registered_url != ccagent_mcphub_url)
  changed_when: true
  failed_when: false
  tags: [mcp, configure]

- name: Register mcphub MCP server
  ansible.builtin.command:
    argv:
      - "{{ ccagent_bin }}"
      - mcp
      - add
      - --transport
      - http
      - mcphub
      - "{{ ccagent_mcphub_url }}"
      - -H
      - "Authorization: Bearer {{ ccagent_mcphub_bearer_key }}"
      - -s
      - user
  become: true
  become_user: "{{ ccagent_user }}"
  environment:
    HOME: "{{ ccagent_home }}"
  args:
    chdir: "{{ ccagent_workdir }}"
  when:
    - ccagent_mcphub_url | length > 0
    - (ccagent_mcp_force_register | default(false) | bool) or (_ccagent_mcphub_registered_url != ccagent_mcphub_url)
  no_log: true
  changed_when: true
  notify: Restart ccagent remote-control service
  tags: [mcp, configure]
